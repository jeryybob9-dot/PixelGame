<!doctype html><meta charset="utf-8"><body style="margin:0;background:#123">
<canvas id="c" width="300" height="300"></canvas>
<script type="module">
import * as THREE from '../src/vendor/three.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
const s = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100); cam.position.set(2, 2, 3); cam.lookAt(0, 0, 0);
s.add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xe8743b })));
s.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(3, 5, 2); s.add(d);
r.render(s, cam);
window.__ok = r.capabilities.isWebGL2 ? 'webgl2' : 'webgl1';
</script>
